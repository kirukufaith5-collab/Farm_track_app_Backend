services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: farmtrack
      POSTGRES_PASSWORD: farmtrack
      POSTGRES_DB: farmtrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmtrack -d farmtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://farmtrack:farmtrack@db:5432/farmtrack
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
